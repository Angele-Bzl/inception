# A docker-network that establishes the connection between your containers
# Your containers have to restart in case of a crash.
# version: "3" #docker version

services: #containers images to use
  nginx: 
    container_name: nginx
    build:
      context: ./requirements
      dockerfile: nginx/Dockerfile
    ports: 
      - "443:443" #port mapping to access from my machine host:container
    restart: always
    depends_on:   
      wordpress:
        condition: service_healthy
        restart: true
    volumes:
      - wordpress_data:/var/www/html # ?
    networks:
      - inception # is a part of the inception network

  mariadb:
    container_name: mariadb
    build:
      context: ./requirements
      dockerfile: mariadb/Dockerfile
    # ports:
    #   - "3306"
    volumes:
      # - wordpress_data:/var/www/html
      - mariadb_data:/var/lib/mysql
    healthcheck:
          test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "--silent"]
          interval: 5s
          timeout: 5s
          retries: 5
    restart: always
    networks:
      - inception # is a part of the inception network
    
  wordpress:
    container_name: wordpress
    build:
      context: ./requirements
      dockerfile: wordpress/Dockerfile
    # ports:
    #   - "8081:443"
    depends_on:   
      mariadb:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "listen", "3000"] # basic placeholder, or check if php-fpm port 9000 is open
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      # - "/home/abarzila/data" #mapping to store and not disappear
      - wordpress_data:/var/www/html
    restart: always
    networks:
      - inception # is a part of the inception network



networks:
  inception: #name of the network
    driver: bridge
    ipam: #ip adress managment
      config:
        - subnet: "172.20.0.0/16" #ip here between quotes

volumes:
  wordpress_data: #check the infos ?
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/abarzila/data/wordpress

  mariadb_data: #check the infos ?
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/abarzila/data/mariadb
